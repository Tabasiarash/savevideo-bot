# savevideo-bot — nginx server for signed download links.
#
# Copy to /etc/nginx/conf.d/savevideo-download-links.conf (or sites-enabled),
# then:
#   1. replace dl.example.com with DOWNLOAD_LINK_BASE_URL's host,
#   2. create the secret include (see savevideo-link-secret.conf.example),
#   3. `sudo nginx -t && sudo systemctl reload nginx`.
#
# Requires nginx built with --with-http_secure_link_module and matching
# DOWNLOAD_LINK_DIR (default /srv/savevideo-links) as `root`.
#
# The bot signs the URI as:  md5( "<expires><uri> <secret>" )  -> base64url
# and calls this equivalent directive:
#   secure_link_md5 "$secure_link_expires$uri $download_link_secret";
# If you change the order or spacing here you MUST change secure_link_token()
# in bot/services/download_links.py to match.

# http-level rate/connection limiting (conf.d is included inside http{}).
limit_conn_zone $binary_remote_addr zone=savevideo_perip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name dl.example.com;

    # Certbot/LE will normally manage the TLS server below; keep plain HTTP
    # only to redirect (and for the ACME challenge path).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dl.example.com;

    # ssl_certificate     /etc/letsencrypt/live/dl.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dl.example.com/privkey.pem;

    # Defines $download_link_secret (mode 640 root:www-data, never committed).
    include /etc/nginx/savevideo-link-secret.conf;

    root /srv/savevideo-links;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /dl/ {
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri $download_link_secret";

        if ($secure_link = "") { return 403; }   # bad/missing signature
        if ($secure_link = "0") { return 410; }  # expired

        # Force a download and keep the random URLs out of search engines.
        add_header Content-Disposition "attachment" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Be gentle: one client should not saturate the link.
        limit_conn savevideo_perip 4;
        limit_rate 4m;
    }
}
