# savevideo-bot — snippet to attach signed download links to an EXISTING vhost.
#
# Use this instead of nginx.conf when the chosen hostname already has a
# server {} block you want to keep (do not create a duplicate server_name).
#
# Prerequisites: the vhost is `listen 443 ssl` with a valid cert, the secret
# include exists (see savevideo-link-secret.conf.example), and
# /srv/savevideo-links is readable by the nginx worker user.
#
# Paste the `location ^~ /dl/` block below INSIDE that server {} block, BEFORE
# any generic `location /` so the prefix match wins. The `limit_conn_zone`
# directive (http context) must live outside the server {} block — put it at the
# top of the vhost file alongside the other http-level directives.

limit_conn_zone $binary_remote_addr zone=savevideo_perip:10m;

server {
    # ... existing vhost directives (listen 443 ssl, server_name, certs) ...

    # Defines $download_link_secret (mode 640 root:www-data, never committed).
    include /etc/nginx/savevideo-link-secret.conf;

    location ^~ /dl/ {
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri $download_link_secret";

        if ($secure_link = "") { return 403; }   # bad/missing signature
        if ($secure_link = "0") { return 410; }  # expired

        root /srv/savevideo-links;
        autoindex off;

        # Force a download and keep the random URLs out of search engines.
        add_header Content-Disposition "attachment" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Be gentle: one client should not saturate the link.
        limit_conn savevideo_perip 4;
        limit_rate 4m;
    }

    # ... existing location / { ... } ...
}
