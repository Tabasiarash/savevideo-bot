# savevideo-bot — production compose stack
#
# Quick start (cloud Bot API, files <= 50 MB):
#   cp .env.example .env   # then set BOT_TOKEN
#   docker compose up -d --build
#
# Large files (up to 2000 MB) via a local Bot API server:
#   1) set BOT_API_URL=http://telegram-bot-api:8081 in .env
#      (legacy: LOCAL_API=true + LOCAL_API_BASE=http://telegram-bot-api:8081)
#   2) set TELEGRAM_API_ID and TELEGRAM_API_HASH in .env
#   3) docker compose --profile localapi up -d --build
#   NOTE: the first time you switch to a local server you must log the bot out
#         of the cloud API (call https://api.telegram.org/bot<token>/logOut).
#   NOTE: the bot and the telegram-bot-api container must share the directory
#         where the bot writes downloads (see deploy/telegram-bot-api/).
#
# Optional cookies for age/region restricted videos:
#   place a Netscape cookies.txt at ./cookies/cookies.txt and set
#   COOKIES_FILE=/cookies/cookies.txt in .env (mounted read-only below).

services:
  bot:
    build: .
    image: savevideo-bot:latest
    env_file: .env
    environment:
      DB_PATH: /data/savevideo.db
      TEMP_DIR: /tmp/savevideo
      # Point the bundled bgutil plugin at the pot-provider sidecar (below).
      YTDLP_EXTRA_ARGS: >-
        --extractor-args youtubepot-bgutilhttp:base_url=http://bgutil:4416
    volumes:
      - bot-data:/data
      - bot-tmp:/tmp/savevideo
      - ./cookies:/cookies:ro
    depends_on:
      - bgutil
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import bot.main, yt_dlp"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3

  # YouTube PO-token provider. Generates the proof-of-origin tokens YouTube now
  # requires; combined with a logged-in cookies.txt (COOKIES_FILE) it clears the
  # "Sign in to confirm you're not a bot" wall on datacenter IPs. Keep this image
  # version in sync with the bgutil-ytdlp-pot-provider pin in requirements.txt.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional local Bot API server. Enabled only with --profile localapi.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["localapi"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - botapi-data:/var/lib/telegram-bot-api
      # The bot hands the local server absolute paths to finished downloads, so
      # the server MUST see the same directory at the same path. Sharing the
      # bot-tmp volume here is what makes >50 MB uploads work.
      - bot-tmp:/tmp/savevideo
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
  bot-tmp:
  botapi-data:
